services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: algotrade
      POSTGRES_PASSWORD: algotrade
      POSTGRES_DB: algotrade
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://algotrade:algotrade@db:5432/algotrade
      JWT_SECRET: change-me-to-a-long-random-string
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
